name: Deploy Puntacos

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Puntacos
        run: |
          rm -rf _site
          mkdir _site
          unzip -q puntacos_actual.zip -d /tmp/puntacos
          cp -R /tmp/puntacos/puntacos/. _site/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir Puntacos
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar Puntacos
        id: deployment
        uses: actions/deploy-pages@v4
